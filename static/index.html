<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WiWo Chatbot</title>
    <link rel="stylesheet" href="./style.css?v=45" /> 
  </head>
  <body>
    <div class="app-shell">
      <div class="phone">
        <div class="header">
          <div class="avatar">
            <img src="./WILO_Logo_2013.svg" alt="Wilo Logo" class="avatar-image" />
          </div>
          <div>
            <h1>WiWo Chatbot</h1>
          </div>
          <div class="menu-wrap">
            <button type="button" class="menu-btn" id="menu-btn" aria-label="Refresh Chat" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="confirmation-modal" id="confirmation-modal" hidden>
          <div class="confirmation-content">
            <div class="confirmation-message">Do you want to start New chat?</div>
            <div class="confirmation-buttons">
              <button type="button" class="confirm-btn cancel-btn" id="confirm-cancel">No</button>
              <button type="button" class="confirm-btn refresh-btn" id="confirm-refresh">Yes</button>
            </div>
          </div>
        </div>

        <div class="thread" id="thread"></div>

        <div class="composer">
          <input id="composer-input" type="text" placeholder="Choose an option above" disabled />
          <button type="button" class="send-btn" id="send-btn" aria-label="Send" disabled>&#10148;</button>
        </div>
        <div class="input-error" id="input-error" hidden></div>

        <div class="modal-backdrop" id="details-backdrop" hidden>
          <div class="modal-panel">
            <div class="modal-header">
              <button type="button" class="modal-back" id="details-close" aria-label="Back">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    d="M15 18l-6-6 6-6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Back
              </button>
              <div class="modal-title">Pump Details</div>
              <div class="modal-spacer"></div>
            </div>
            <div class="modal-body" id="details-body"></div>
          </div>
        </div>

        <div class="image-fullscreen" id="image-fullscreen" hidden>
          <button type="button" class="image-close" id="image-close" aria-label="Close">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <img id="fullscreen-image" src="" alt="Full screen pump image" />
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
