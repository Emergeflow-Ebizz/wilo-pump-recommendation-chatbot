<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wilo Pumps Selection Chatbot</title>
    <link rel="stylesheet" href="./css/style.css?v=3" />
  </head>
  <body>
    <div class="app-shell">
      <div class="phone">
        <div class="header">
          <div class="avatar">
            <img src="./images/wilo_logo.svg" alt="Wilo Logo" class="avatar-image" />
          </div>
          <div>
            <h1>Wilo Pumps Selection Chatbot</h1>
            <div class="status"><span class="dot"></span>Online</div>
          </div>
          <div class="menu-wrap">
            <button type="button" class="menu-btn" id="menu-btn" aria-label="Refresh Chat" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="confirmation-modal" id="confirmation-modal" hidden>
          <div class="confirmation-content">
            <div class="confirmation-message">Do you want to refresh the chat?</div>
            <div class="confirmation-buttons">
              <button type="button" class="confirm-btn cancel-btn" id="confirm-cancel">Cancel</button>
              <button type="button" class="confirm-btn refresh-btn" id="confirm-refresh">Refresh</button>
            </div>
          </div>
        </div>

        <div class="thread" id="thread"></div>

        <div class="composer">
          <input id="composer-input" type="text" placeholder="Choose an option above" disabled />
          <button type="button" class="send-btn" id="send-btn" aria-label="Send" disabled>&#10148;</button>
        </div>
        <div class="input-error" id="input-error" hidden></div>

        <div class="modal-backdrop" id="details-backdrop" hidden>
          <div class="modal-panel">
            <div class="modal-header">
              <button type="button" class="modal-back" id="details-close" aria-label="Back">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    d="M15 18l-6-6 6-6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Back
              </button>
              <div class="modal-title">Pump Details</div>
            </div>
            <div class="modal-body" id="details-body"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
